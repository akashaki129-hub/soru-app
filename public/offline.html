<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soru offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #fff8ea;
        color: #1f1b16;
      }
      main {
        max-width: 32rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: clamp(2rem, 8vw, 4rem);
        line-height: 0.95;
        margin: 0;
      }
      p {
        color: #6f6558;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Soru is offline.</h1>
      <p>
        Please reconnect to continue using customer, chef, or admin features. For safety, Soru does
        not cache authenticated dashboards or private food-order data.
      </p>
    </main>
  </body>
</html>
